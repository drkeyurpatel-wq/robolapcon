<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboLapCon 2026 — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit','Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:#1B2A4A;border-radius:16px;padding:40px;max-width:380px;width:100%;text-align:center;border:1px solid #334155}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:6px}
.login-box p{font-size:13px;color:#5B7BA5;margin-bottom:24px}
.input{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:16px;outline:none;font-family:'Outfit',sans-serif;text-align:center;letter-spacing:3px}
.input:focus{border-color:#00A99D;box-shadow:0 0 0 2px rgba(0,169,157,0.15)}
.btn{padding:12px 24px;border-radius:8px;border:none;background:#00A99D;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:'Outfit',sans-serif;width:100%;margin-top:12px}
.btn:hover{background:#088F84}
.hidden{display:none}
.dashboard{padding:24px;max-width:1100px;margin:0 auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.top-bar h1{font-size:22px;font-weight:700}
.top-bar h1 span{color:#00A99D}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.stat-card{background:#1B2A4A;border-radius:10px;padding:16px 20px;flex:1;min-width:140px;border:1px solid #334155}
.stat-num{font-size:28px;font-weight:800;color:#00A99D}
.stat-label{font-size:11px;color:#5B7BA5;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.btn-download{padding:10px 20px;border-radius:8px;border:none;background:#00A99D;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:6px}
.btn-download:hover{background:#088F84}
.btn-refresh{padding:10px 20px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;font-weight:600;font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif}
.btn-refresh:hover{border-color:#00A99D;color:#00A99D}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0}
th{background:#1B2A4A;color:#94a3b8;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:10px 12px;text-align:left;border-bottom:2px solid #334155}
td{padding:10px 12px;border-bottom:1px solid #1e293b;color:#cbd5e1}
tr:hover td{background:rgba(0,169,157,0.05)}
.code-pill{background:rgba(253,185,19,0.1);color:#FDB913;padding:3px 8px;border-radius:4px;font-weight:600;font-size:12px;letter-spacing:0.5px}
.status-confirmed{color:#00A99D;font-weight:600}
.empty{text-align:center;padding:60px;color:#5B7BA5}
.table-wrap{background:#1B2A4A;border-radius:12px;border:1px solid #334155;overflow:auto;max-height:calc(100vh - 280px)}
</style>
</head>
<body>

<!-- Login Gate -->
<div id="login-page" class="login-wrap">
  <div class="login-box">
    <h2><span style="color:#e2e8f0">RoboLap</span><span style="color:#E31E24">Con</span> Admin</h2>
    <p>Enter admin password to access registrations</p>
    <input class="input" type="password" id="admin-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">Access Dashboard</button>
    <div id="login-err" style="color:#E31E24;font-size:12px;margin-top:10px"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="hidden">
  <div class="dashboard">
    <div class="top-bar">
      <h1><span>RoboLap</span><span style="color:#E31E24">Con</span> 2026 — Registrations</h1>
      <div style="display:flex;gap:8px">
        <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
        <button class="btn-download" onclick="downloadExcel()">📥 Download Excel</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="s-total">-</div><div class="stat-label">Registered</div></div>
      <div class="stat-card"><div class="stat-num" id="s-remaining">-</div><div class="stat-label">Seats Left</div></div>
      <div class="stat-card"><div class="stat-num" id="s-codes-used">-</div><div class="stat-label">Codes Used</div></div>
      <div class="stat-card"><div class="stat-num" id="s-today">-</div><div class="stat-label">Today</div></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Invite Code</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Hospital</th>
            <th>Speciality</th>
            <th>City</th>
            <th>MCR</th>
            <th>Exp</th>
            <th>Diet</th>
            <th>Registered On</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="reg-body">
          <tr><td colspan="13" class="empty">Loading registrations...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPA_URL='https://gswmbggizvcsfeqgsyrt.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdzd21iZ2dpenZjc2ZlcWdzeXJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDY3OTksImV4cCI6MjA5MTMyMjc5OX0.mM2nsw6vPPp-6APsYT2QuovnZId7VWixBLvCZkjVorQ';
const ADMIN_PASS='Health1@RLC2026';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let allRegs=[];

function doLogin(){
  const pw=document.getElementById('admin-pw').value;
  if(pw===ADMIN_PASS){
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadData();
  }else{
    document.getElementById('login-err').textContent='Incorrect password';
  }
}

async function loadData(){
  // Use RPC to get registrations (bypasses RLS via service-level function)
  const{data,error}=await sb.rpc('rlc_get_registrations',{p_password:ADMIN_PASS});
  if(error||!data){
    document.getElementById('reg-body').innerHTML='<tr><td colspan="13" class="empty">Error loading data. Check console.</td></tr>';
    console.error(error);
    return;
  }
  allRegs=data;
  renderTable(data);
  updateStats(data);
}

function updateStats(regs){
  const total=regs.length;
  const today=regs.filter(r=>{
    const d=new Date(r.created_at);
    const now=new Date();
    return d.toDateString()===now.toDateString();
  }).length;
  const codesUsed=new Set(regs.map(r=>r.invite_code)).size;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-remaining').textContent=Math.max(0,200-total);
  document.getElementById('s-codes-used').textContent=codesUsed;
  document.getElementById('s-today').textContent=today;
}

function renderTable(regs){
  if(!regs.length){
    document.getElementById('reg-body').innerHTML='<tr><td colspan="13" class="empty">No registrations yet</td></tr>';
    return;
  }
  document.getElementById('reg-body').innerHTML=regs.map((r,i)=>`<tr>
    <td>${i+1}</td>
    <td><span class="code-pill">${r.invite_code}</span></td>
    <td style="font-weight:600">${r.name}</td>
    <td>${r.phone}</td>
    <td>${r.email}</td>
    <td>${r.hospital||'-'}</td>
    <td>${r.speciality||'-'}</td>
    <td>${r.city||'-'}</td>
    <td>${r.mcr_number||'-'}</td>
    <td>${r.experience||'-'}</td>
    <td>${r.dietary||'-'}</td>
    <td>${new Date(r.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
    <td class="status-confirmed">${r.status}</td>
  </tr>`).join('');
}

function downloadExcel(){
  if(!allRegs.length){alert('No registrations to export.');return;}
  const rows=allRegs.map((r,i)=>({
    '#':i+1,
    'Invite Code':r.invite_code,
    'Name':r.name,
    'Phone':r.phone,
    'Email':r.email,
    'Hospital':r.hospital||'',
    'Speciality':r.speciality||'',
    'City':r.city||'',
    'MCR Number':r.mcr_number||'',
    'Experience':r.experience||'',
    'Dietary':r.dietary||'',
    'Registered On':new Date(r.created_at).toLocaleString('en-IN'),
    'Status':r.status
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{w:5},{w:14},{w:25},{w:14},{w:28},{w:25},{w:22},{w:15},{w:12},{w:10},{w:14},{w:20},{w:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Registrations');
  XLSX.writeFile(wb,`RoboLapCon2026_Registrations_${new Date().toISOString().slice(0,10)}.xlsx`);
}
</script>
</body>
</html>
